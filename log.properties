#Payara Micro Logging Properties File

#java util logging log levels
#ALL indicates that all messages should be logged.
#CONFIG is a message level for static configuration messages.
#FINE is a message level providing tracing information.
#FINER indicates a fairly detailed tracing message.
#FINEST indicates a highly detailed tracing message.
#INFO is a message level for informational messages.
#OFF is a special level that can be used to turn off logging.
#SEVERE is a message level indicating a serious failure.
#WARNING is a message level indicating a potential problem.
#
#A pattern consists of a string that includes the following special components that will be replaced at runtime:
#
#"/" the local pathname separator
#"%t" the system temporary directory
#"%h" the value of the "user.home" system property
#"%g" the generation number to distinguish rotated logs
#"%u" a unique number to resolve conflicts
#"%%" translates to a single percent sign "%"

## Handlers
handlers=java.util.logging.ConsoleHandler
#java.util.logging.ConsoleHandler.formatter=com.sun.enterprise.server.logging.ODLLogFormatter
#java.util.logging.ConsoleHandler.level=FINE
#handlers=java.util.logging.FileHandler
java.util.logging.ConsoleHandler.formatter=com.sun.enterprise.server.logging.ODLLogFormatter
java.util.logging.ConsoleHandler.level=FINEST
java.util.logging.FileHandler.limit=100000000
java.util.logging.FileHandler.count=1
java.util.logging.FileHandler.level=FINEST
java.util.logging.SimpleFormatter.format=[%1$tFT%1$tT.%1$tL] [%4$-7s] %2$s [[%n        %5$s%6$s%n%n
#java.util.logging.FileHandler.formatter=com.sun.enterprise.server.logging.ODLLogFormatter
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.pattern=%t/guitarinfo.log

com.sun.enterprise.server.logging.ODLLogFormatter.ansiColor=true

## Global Level
.level=INFO

